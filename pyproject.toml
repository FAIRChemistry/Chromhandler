[project]
authors = [{email = "83341109+haeussma@users.noreply.github.com", name = "haeussma"}]
dependencies = [
  "numpy>=2.1.0",
  "scipy>=1.12.0",
  "pyenzyme>=2.1.0,<3.0.0",
  "pydantic>=2,<3",
  "rich>=13.7,<15",
  "loguru>=0.7,<1",
  "numpyro>=0.19.0",
  "jaxopt>=0.8.5",
  "tensorflow-probability>=0.25.0",
  "arviz>=0.22.0",
  "ipykernel>=6.30.1",
  "ipywidgets>=8.1.7",
  "pybaselines>=1.2.1",
  "dotted-dict>=1.1.3",
  "jaxtyping>=0.3.7",
]
description = "Tool for processing chromatography data"
license = {text = "MIT"}
name = "chromhandler"
readme = "README.md"
requires-python = ">=3.10,<3.15"
version = "1.0.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27"]

[dependency-groups]
dev = [
  "pre-commit>=3.7,<4",
  "ruff>=0.6,<1",
  "pytest>=8.0.2",
  "devtools>=0.12.2",
  "mkdocs-material>=9.6.16",
  "mkdocstrings[python]>=0.30.0",
  "nbval>=0.11.0",
  "mkdocs-jupyter>=0.25.1",
  "pyright>=1.1.405",
  "pandas-stubs>=2.3.3.260113",
  "groups>=0.1",
  "pytest-sugar>=1.1.1",
]

[project.urls]
Homepage = "https://github.com/haeussma/chromhandler"

[tool.hatch.build]
exclude = ["tests", "docs", "mkdocs.yml", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["chromhandler"]

[tool.pytest.ini_options]
markers = [
  "unit: marks tests as unit tests (use '-m unit')",
  "integration: marks tests as integration tests (use '-m integration')",
  "fitting: marks tests as fitting-specific tests (use '-m fitting')",
  "readers: marks tests as slow (deselect with '-m \"not readers\"')",
  "core: marks tests as core (deselect with '-m \"not core\"')"
]

[tool.ruff]
line-length = 110

[tool.pyright]
include = ["chromhandler", "tests"]
exclude = [
  "**/__pycache__",
  ".git",
  ".venv",
  "build",
  "dist",
]
pythonVersion = "3.13"
typeCheckingMode = "strict"
stubPath = "typings"
reportUnknownMemberType = "none"
reportMissingTypeStubs = "none"
reportUnknownVariableType = "none"
reportIndexIssue = "none"

[tool.ruff.lint]
select = [
    "F",      # Pyflakes — catches real bugs (undefined names, unused imports)
    "E",      # pycodestyle errors — style consistency
    "W",      # pycodestyle warnings
    "I",      # isort — import sorting
    "B",      # flake8-bugbear — dangerous patterns (mutable defaults, etc.)
    "UP",     # pyupgrade — modern syntax
    "C4",     # comprehensions — clearer, faster
    "RUF",    # Ruff-specific — high-signal rules
    "PERF",   # performance footguns
    "TCH",    # TYPE_CHECKING imports — pairs with your strict typing
]

[tool.coverage.run]
# Track coverage for chromhandler package
source = ["chromhandler"]

# Don't track test files themselves
omit = [
    "*/tests/*",
    "*/setup.py",
    "chromhandler/__pycache__/*",
]

[tool.coverage.report]
# Fail CI if coverage drops below this percentage
fail_under = 75

# Don't report files with high coverage
skip_covered = false

# Lines to exclude from coverage (e.g., error handling, abstract methods)
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abstractproperty",
    "class .*Protocol.*:",
    "\\.\\.\\.",
]

# Precision (default 2 decimal places)
precision = 2

[tool.coverage.html]
# Output directory for HTML coverage report
directory = "htmlcov"

[tool.coverage.json]
# Output JSON report for tools like codecov
output = "coverage.json"
