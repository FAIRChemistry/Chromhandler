# Keep this file name: PyPI's trusted publisher for chromhandler is bound to
# `release.yaml` and the `pypi` environment.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10
      - run: uv build
      - name: Smoke test the wheel and the sdist
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "import chromhandler; print(chromhandler.__version__)"
          uv run --isolated --no-project --with dist/*.tar.gz python -c "import chromhandler; print(chromhandler.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chromhandler
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: astral-sh/setup-uv@v10
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: uv publish

  attach-to-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload assets to the release that triggered this run
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release upload "$TAG" dist/* --repo "$REPO" --clobber
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
